# LLM 공급자 설정
# - providers: 사용할 수 있는 모델 목록 (이름은 자유롭게)
# - tasks: 작업마다 어떤 공급자를 쓸지
# 명령줄에서 --provider <이름> 을 주면 tasks 설정보다 우선한다.

[providers.claude]
type = "claude"
model = "claude-opus-5-5"
effort = "medium"            # low | medium | high | xhigh | max

[providers.local]
type = "local"
# 로컬 서버에 설치한 모델 이름으로 바꾼다 (예: Ollama 의 `ollama list` 결과)
model = "qwen2.5:14b"
# OpenAI 호환 주소. Ollama: http://localhost:11434/v1, vLLM: http://localhost:8000/v1
base_url = "http://localhost:11434/v1"
timeout = 300

[tasks]
extraction = "claude"        # 조건 추출 (매일 배치)
answer_parsing = "local"     # 답변 해석 (실시간, 민감정보가 외부로 나가지 않음)
question_wording = "local"   # 질문 문장화
explanation = "local"        # 추천 설명
verification = "claude"      # 독립 검증 (추출과 다른 모델이면 더 좋음)
